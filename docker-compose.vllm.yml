# Multi-node Ray cluster for 2× GB10 (1 GPU per node)
#
# Builds a thin image that adds Ray (stock vllm/vllm-openai no longer ships it).
# vLLM is NOT a separate service — it must be started inside the ray-head container
# so it can join the Ray session. See start-vllm.sh or deploy.sh.
#
# On head:
#   docker compose -f docker-compose.vllm.yml --profile head up -d --build
# On worker:
#   docker compose -f docker-compose.vllm.yml --profile worker up -d --build
#
# Confirm 2 nodes / 2 GPUs before starting vLLM:
#   docker exec ray-head ray status

services:
  ray-head:
    build:
      context: .
      dockerfile: Dockerfile.vllm-ray
    image: local/vllm-ray:latest
    container_name: ray-head
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - NCCL_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-0}
      - GLOO_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - TP_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - /dev/infiniband:/dev/infiniband
    entrypoint: ["/bin/bash"]
    command:
      - -c
      - "ray start --head --node-ip-address=${HEAD_IP} --port=6379 --dashboard-host=0.0.0.0 --block"
    profiles: [head]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ray-worker:
    build:
      context: .
      dockerfile: Dockerfile.vllm-ray
    image: local/vllm-ray:latest
    container_name: ray-worker
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - NCCL_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-0}
      - GLOO_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - TP_SOCKET_IFNAME=${NCCL_IF:-eth0}
    volumes:
      - /dev/infiniband:/dev/infiniband
    entrypoint: ["/bin/bash"]
    command:
      - -c
      - "ray start --address=${HEAD_IP}:6379 --node-ip-address=${WORKER_IP} --block"
    profiles: [worker]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
