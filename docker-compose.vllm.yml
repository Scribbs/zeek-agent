# Multi-node vLLM for 2× GB10 cluster
# Head node runs the API + coordinates tensor parallel.
# Worker node joins the Ray cluster.
#
# Note: the vllm/vllm-openai image entrypoint is already `vllm`,
# so the command is just `serve ...` (not `vllm serve ...`).
#
# On head:
#   docker compose -f docker-compose.vllm.yml --profile head up -d
# On worker:
#   docker compose -f docker-compose.vllm.yml --profile worker up -d

services:
  vllm-head:
    image: vllm/vllm-openai:latest
    container_name: vllm-head
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - NCCL_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-0}
      - GLOO_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - TP_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - VLLM_HOST_IP=${HEAD_IP}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - /dev/infiniband:/dev/infiniband
    command: >
      serve ${VLLM_MODEL:-nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4}
      --host 0.0.0.0
      --port ${VLLM_PORT:-8000}
      --tensor-parallel-size 2
      --pipeline-parallel-size 1
      --gpu-memory-utilization 0.80
      --max-model-len 32768
      --trust-remote-code
    profiles: [head]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-worker:
    image: vllm/vllm-openai:latest
    container_name: vllm-worker
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - NCCL_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-0}
      - GLOO_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - TP_SOCKET_IFNAME=${NCCL_IF:-eth0}
      - VLLM_HOST_IP=${HEAD_IP}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - /dev/infiniband:/dev/infiniband
    entrypoint: ["ray"]
    command: >
      start --address=${HEAD_IP}:6379 --block
    profiles: [worker]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
