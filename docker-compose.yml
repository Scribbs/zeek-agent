services:
  # Optional: run Zeek itself inside the stack (comment out if using host/NFS Zeek logs)
  zeek:
    image: zeek/zeek:lts
    container_name: zeek
    restart: unless-stopped
    networks:
      - zeek-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    working_dir: /usr/local/zeek/logs
    command: zeek -i eth0 local          # change eth0 to your capture interface
    volumes:
      - ${ZEEK_LOG_DIR:-/opt/zeek/logs}:/usr/local/zeek/logs

  zeek-summarizer:
    build: ./summarizer
    container_name: zeek-summarizer
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ${ZEEK_LOG_DIR:-/opt/zeek/logs}:/zeek/logs:ro
      - summarizer-data:/app/data
    environment:
      # Point at NemoClaw-managed vLLM (OpenAI-compatible endpoint)
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - MODEL=${VLLM_MODEL:-nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4}
      - REFRESH_SECONDS=${REFRESH_SECONDS:-60}
      - LOG_WINDOW_MINUTES=${LOG_WINDOW_MINUTES:-15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zeek
    networks:
      - zeek-net

volumes:
  summarizer-data:

networks:
  zeek-net:
    name: zeek-net
    driver: bridge
